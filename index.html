  :root {
    --header-blue: #0070C0;
    --border-color: #000000;

  * { box-sizing: border-box; }

  body {
    background-color: #58585a;
    color: var(--text-color);
    font-family: "Times New Roman", Georgia, serif;
    margin: 0;
    padding: 24px 0 60px 0;
    display: flex;
    flex-direction: column;
    align-items: center;

    width: 210mm;
    max-width: 95vw;
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    justify-content: flex-end;
    font-family: Arial, sans-serif;

  .btn {
    padding: 9px 18px;
    background-color: #ffffff;
    color: #222222;
    border: 1px solid #b5b5b5;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }
  .btn:hover { background-color: #eeeeee; }

  .btn-primary { background-color: var(--header-blue); color: #ffffff; border-color: #005b9c; }
  .btn-primary:hover { background-color: #005b9c; }

  .btn-danger { background-color: #c0392b; color: #ffffff; border-color: #a5301f; }
  .btn-danger:hover { background-color: #a5301f; }

  .btn-add { background-color: #2e8b57; color: #ffffff; border-color: #24704a; }
  .btn-add:hover { background-color: #24704a; }

  .file-input { display: none; }

  .info-row.rtl-row { direction: ltr; justify-content: flex-start; }

  .editable {
    outline: none;
    border: 1px dashed transparent;
    padding: 1px 5px;
    border-radius: 2px;
    min-width: 20px;
  }
  .editable:hover, .editable:focus { border-color: var(--header-blue); background-color: rgba(0,112,192,0.06); }

  /* table cells keep their solid border at all times, even when editable */
  td.editable {
    border: 1px solid var(--border-color) !important;
  }
  td.editable:hover, td.editable:focus {
    border-color: var(--header-blue) !important;
    background-color: rgba(0,112,192,0.06);
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 3px;
    margin-top: 4px;
    margin-bottom: 16px;
    background-color: transparent;
    font-family: "Times New Roman", Georgia, serif;
  }

  th, td {
    border: 1px solid var(--border-color);
    padding: 6px 4px;
    text-align: center;
    font-size: 10.5px;
    vertical-align: middle;
    background-color: rgba(255,255,255,0.92);
  }

  td { overflow-wrap: break-word; }

  th {
    background-color: var(--header-blue) !important;
    color: #ffffff;
    font-weight: bold;
    font-size: 10px;
    line-height: 1.25;
  }

  td.item-desc { text-align: left; }

  .photo-row td {
    border: none;
    background: transparent;
    padding: 6px 0 14px 0;
  }

  .item-photo-wrap { display: flex; justify-content: center; }

  .item-photo-box {
    width: 200px;
    height: 200px;
    border: 1px dashed #999999;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(255,255,255,0.75);
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  .item-photo-box:hover { border-color: var(--header-blue); }

  .item-photo-box img {
    width: 256px;
    height: 256px;
    object-fit: contain;
    background-color: #ffffff;
    display: block;
  }

  .photo-placeholder-text {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #888888;
  }

  .photo-remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background-color: #c0392b;
    color: #ffffff;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .photo-remove-btn:hover { background-color: #a5301f; }

  .row-del {
    background: transparent;
    border: none;
    color: #c0392b;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
  }
  .row-del:hover { color: #7c1f17; }

  .add-row-wrap { text-align: left; margin: -10px 0 18px 0; }
  .add-row-btn {
    font-family: Arial, sans-serif;
    font-size: 12px;
    padding: 5px 12px;
    background: #ffffff;
    border: 1px dashed var(--header-blue);
    color: var(--header-blue);
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .add-row-btn:hover { background: rgba(0,112,192,0.08); }

  .note-section {
    font-size: 12px;
    font-weight: bold;
    margin-top: 4px;
    margin-bottom: 14px;
  }

  .total-banner {
    border: 1px solid var(--border-color);
    padding: 9px 12px;
    font-weight: bold;
    font-size: 13px;
    background-color: rgba(255,255,255,0.92);
  }

  @media print {
    body { background: none; padding: 0; }
    .toolbar, .row-del, .add-row-wrap { display: none !important; }
    .a4-page {
      box-shadow: none;
      width: 210mm;
      min-height: 297mm;
      padding: 44mm 20mm 32mm 20mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .editable:hover, .editable:focus { border-color: transparent; background-color: transparent; }
    table, .total-banner { background-color: transparent; }
    .item-photo-box { cursor: default; }
    .item-photo-box:not(.has-photo) { border-color: #cccccc; }
    .photo-remove-btn { display: none !important; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="document.getElementById('excelInput').click()">Load from Excel</button>
    <input type="file" id="excelInput" class="file-input" accept=".xlsx,.xls" onchange="handleExcelUpload(event)">
    <button class="btn btn-danger" onclick="clearEntries()">Clear Entries</button>
    <button class="btn" onclick="exportPDF()">Export PDF</button>
  </div>

  <div class="a4-page" id="document-page">

    <div class="tender-title">NUPCO TENDER</div>

    <div class="info-block">
      <div class="info-row">
        <span>NUPCO TENDER NO:</span>
        <span id="tender-no" class="editable" contenteditable="true"></span>
      </div>
      <div class="info-row rtl-row">
        <span>TENDER NAME:</span>
        <span id="tender-name" class="editable" contenteditable="true" dir="rtl"></span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:4%">SN</th>
          <th style="width:9%">NUPCO CODE</th>
          <th style="width:7%">Catalogue No.</th>
          <th style="width:18%">Item Description</th>
          <th style="width:6%">MFR.</th>
          <th style="width:5%">UOM</th>
          <th style="width:5%">Qty</th>
          <th style="width:9%">Unit Price Without VAT SAR</th>
          <th style="width:8%">VAT Percentage</th>
          <th style="width:9%">Unit Price with Vat SAR</th>
          <th style="width:9%">Total Price With VAT SAR</th>
          <th style="width:3%"></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="item-row">
          <td class="editable" contenteditable="true">3</td>
          <td class="editable" contenteditable="true"></td>
          <td class="editable" contenteditable="true"></td>
          <td class="editable item-desc" contenteditable="true"></td>
          <td class="editable" contenteditable="true"></td>
          <td class="editable" contenteditable="true"></td>
          <td class="editable field-qty" contenteditable="true" oninput="recalculateRow(this)"></td>
          <td class="editable field-price" contenteditable="true" oninput="recalculateRow(this)"></td>
          <td class="editable field-vat" contenteditable="true" oninput="recalculateRow(this)"></td>
          <td class="field-unit-vat"></td>
          <td class="field-total-vat"></td>
          <td><button class="row-del" onclick="deleteRow(this)" title="Delete row">&times;</button></td>
        </tr>
        <tr class="photo-row">
          <td colspan="12">
            <div class="item-photo-wrap">
              <input type="file" accept="image/*" class="photo-file-input" style="display:none" onchange="handlePhotoUpload(event, this)">
              <div class="item-photo-box" onclick="this.previousElementSibling.click()">
                <span class="photo-placeholder-text">+ Add Photo</span>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="add-row-wrap">
      <button class="add-row-btn" onclick="addRow()">+ Add Row</button>
    </div>

    <div class="note-section">
      Note:&nbsp;<span id="note-text" class="editable" contenteditable="true">Unit of Pack-Pack</span>
    </div>

    <div class="total-banner">
      <div>Total Amount with VAT (SAR): <span id="total-number">0.00</span></div>
      <div id="total-text" style="margin-top:4px;">Zero Saudi Riyal.</div>
    </div>

  </div>

<script>
  const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
    'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const SCALES = ['', 'Thousand', 'Million', 'Billion'];

  function threeDigitsToWords(num) {
    let str = '';
    if (num >= 100) {
      str += ONES[Math.floor(num / 100)] + ' Hundred ';
      num %= 100;
    }
    if (num >= 20) {
      const t = Math.floor(num / 10);
      const o = num % 10;
      str += TENS[t] + (o > 0 ? '-' + ONES[o] : '') + ' ';
      num = 0;
    } else if (num >= 10) {
      str += ONES[num] + ' ';
      num = 0;
    }
    if (num > 0) str += ONES[num] + ' ';
    return str.trim();
  }

  function integerToWords(n) {
    if (n === 0) return 'Zero';
    let scaleIdx = 0;
    const parts = [];
    while (n > 0) {
      const chunk = n % 1000;
      if (chunk) {
        let chunkWords = threeDigitsToWords(chunk);
        if (scaleIdx > 0) chunkWords += ' ' + SCALES[scaleIdx];
        parts.unshift(chunkWords);
      }
      n = Math.floor(n / 1000);
      scaleIdx++;
    }
    return parts.join(' ');
  }

  function amountToSarWords(amount) {
    amount = Math.round(amount * 100) / 100;
    const riyals = Math.floor(amount);
    const halalas = Math.round((amount - riyals) * 100);
    let text = integerToWords(riyals) + ' Saudi Riyal';
    if (halalas > 0) {
      text += ' and ' + integerToWords(halalas) + ' Halala';
    }
    return text + '.';
  }

  function recalcGrandTotal() {
    let sum = 0;
    document.querySelectorAll('.field-total-vat').forEach(td => {
      sum += parseFloat((td.textContent || '0').replace(/,/g, '')) || 0;
    });
    document.getElementById('total-number').textContent = sum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById('total-text').textContent = amountToSarWords(sum);
  }
</script>
<script>
  function recalculateRow(el) {
    const row = el.closest('tr');
    const qty = parseFloat((row.querySelector('.field-qty').innerText || '0').replace(/,/g, '')) || 0;
    const price = parseFloat((row.querySelector('.field-price').innerText || '0').replace(/,/g, '')) || 0;
    const vatPct = parseFloat((row.querySelector('.field-vat').innerText || '0').replace(/,/g, '').replace('%', '')) || 0;

    const unitWithVat = price + (price * vatPct / 100);
    const totalWithVat = qty * unitWithVat;

    row.querySelector('.field-unit-vat').innerText = unitWithVat.toFixed(2);
    row.querySelector('.field-total-vat').innerText = totalWithVat.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    recalcGrandTotal();
  }

  function val(v, d) { return (v === undefined || v === null) ? d : v; }

  function makeRow(vals) {
    vals = vals || ['', '', '', '', '', '', 0, 0, 0];
    const tr = document.createElement('tr');
    tr.className = 'item-row';
    tr.innerHTML = `
      <td class="editable" contenteditable="true">${val(vals[0], '')}</td>
      <td class="editable" contenteditable="true">${val(vals[1], '')}</td>
      <td class="editable" contenteditable="true">${val(vals[2], '')}</td>
      <td class="editable item-desc" contenteditable="true">${val(vals[3], '')}</td>
      <td class="editable" contenteditable="true">${val(vals[4], '')}</td>
      <td class="editable" contenteditable="true">${val(vals[5], '')}</td>
      <td class="editable field-qty" contenteditable="true" oninput="recalculateRow(this)">${val(vals[6], 0)}</td>
      <td class="editable field-price" contenteditable="true" oninput="recalculateRow(this)">${val(vals[7], 0)}</td>
      <td class="editable field-vat" contenteditable="true" oninput="recalculateRow(this)">${val(vals[8], 0)}</td>
      <td class="field-unit-vat">0.00</td>
      <td class="field-total-vat">0.00</td>
      <td><button class="row-del" onclick="deleteRow(this)" title="Delete row">&times;</button></td>
    `;
    return tr;
  }

  function makePhotoRow() {
    const tr = document.createElement('tr');
    tr.className = 'photo-row';
    tr.innerHTML = `
      <td colspan="12">
        <div class="item-photo-wrap">
          <input type="file" accept="image/*" class="photo-file-input" style="display:none" onchange="handlePhotoUpload(event, this)">
          <div class="item-photo-box" onclick="this.previousElementSibling.click()">
            <span class="photo-placeholder-text">+ Add Photo</span>
          </div>
        </div>
      </td>
    `;
    return tr;
  }

  function handlePhotoUpload(event, inputEl) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const box = inputEl.nextElementSibling;
      box.classList.add('has-photo');
      box.innerHTML = `<img src="${e.target.result}" alt="item photo">
        <button type="button" class="photo-remove-btn" onclick="removePhoto(event, this)" title="Remove photo">&times;</button>`;
    };
    reader.readAsDataURL(file);
  }

  function removePhoto(event, btn) {
    event.stopPropagation();
    const box = btn.closest('.item-photo-box');
    box.classList.remove('has-photo');
    box.innerHTML = '<span class="photo-placeholder-text">+ Add Photo</span>';
    const input = box.previousElementSibling;
    if (input && input.classList.contains('photo-file-input')) input.value = '';
  }

  function addRow() {
    const tbody = document.getElementById('table-body');
    const tr = makeRow();
    const photoTr = makePhotoRow();
    tbody.appendChild(tr);
    tbody.appendChild(photoTr);
    recalculateRow(tr.querySelector('.field-qty'));
  }

  function resetPhotoRow(photoRow) {
    if (!photoRow) return;
    const box = photoRow.querySelector('.item-photo-box');
    if (box) {
      box.classList.remove('has-photo');
      box.innerHTML = '<span class="photo-placeholder-text">+ Add Photo</span>';
    }
    const input = photoRow.querySelector('.photo-file-input');
    if (input) input.value = '';
  }

  function deleteRow(btn) {
    const tbody = document.getElementById('table-body');
    const itemRow = btn.closest('tr');
    const photoRow = itemRow.nextElementSibling;
    const itemRows = tbody.querySelectorAll('tr.item-row');

    if (itemRows.length <= 1) {
      itemRow.querySelectorAll('.editable').forEach(el => el.innerText = '');
      recalculateRow(itemRow.querySelector('.field-qty'));
      if (photoRow && photoRow.classList.contains('photo-row')) resetPhotoRow(photoRow);
      return;
    }

    if (photoRow && photoRow.classList.contains('photo-row')) photoRow.remove();
    itemRow.remove();
    recalcGrandTotal();
  }

  function clearEntries() {
    document.querySelectorAll('.editable').forEach(el => el.innerText = '');
    document.querySelectorAll('.field-unit-vat, .field-total-vat').forEach(el => el.innerText = '0.00');
    document.querySelectorAll('.photo-row').forEach(resetPhotoRow);
    recalcGrandTotal();
  }

  function exportPDF() { window.print(); }

  function handleExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      if (rows.length > 1) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.length === 0) continue;
          const tr = makeRow(r);
          const photoTr = makePhotoRow();
          tbody.appendChild(tr);
          tbody.appendChild(photoTr);
          recalculateRow(tr.querySelector('.field-qty'));
        }
      }
    };
    reader.readAsArrayBuffer(file);
  }

  document.addEventListener('DOMContentLoaded', recalcGrandTotal);
  recalcGrandTotal();
</script>
</body>
</html>
